<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#f1f4f8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAFA – comprendre le marché avant d’investir</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f1f4f8;--surf:#ffffff;--ink:#14202e;--mut:#566579;--line:#d5dce6;
  --acc:#2a3f8f;--acc-ink:#ffffff;--acc-t:#e6ebfa;
  --ok:#16704a;--ok-t:#e2f3ea;--warn:#a85f00;--warn-t:#fdf0d9;--bad:#b0302a;--bad-t:#fbe6e4;
  --c-verse:#6c7a8b;--c-prud:#b9770e;--c-cent:#2a3f8f;--c-fav:#16704a;--c-krach:#b0302a;--c-dif:#b0302a;--c-sr:#7b4fc4;
  --f-tit:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --f-txt:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1722;--surf:#17212f;--ink:#e7edf5;--mut:#9aa8ba;--line:#2b3849;
    --acc:#9db0ff;--acc-ink:#0f1722;--acc-t:#212d4d;
    --ok:#52c98f;--ok-t:#16322a;--warn:#e3a53f;--warn-t:#3a2d12;--bad:#ff8077;--bad-t:#3b1d1b;
    --c-verse:#8d9bad;--c-prud:#e3a53f;--c-cent:#9db0ff;--c-fav:#52c98f;--c-krach:#ff8077;--c-sr:#c4a8ff;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1722;--surf:#17212f;--ink:#e7edf5;--mut:#9aa8ba;--line:#2b3849;
  --acc:#9db0ff;--acc-ink:#0f1722;--acc-t:#212d4d;
  --ok:#52c98f;--ok-t:#16322a;--warn:#e3a53f;--warn-t:#3a2d12;--bad:#ff8077;--bad-t:#3b1d1b;
  --c-verse:#8d9bad;--c-prud:#e3a53f;--c-cent:#9db0ff;--c-fav:#52c98f;--c-krach:#ff8077;--c-sr:#c4a8ff;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--f-txt);font-variant-numeric:tabular-nums}
.app{max-width:760px;margin:0 auto;padding:0 16px}
header.haut{padding:18px 0 8px}
.marque{font-family:var(--f-tit);font-size:25px;font-weight:700;letter-spacing:.2px}
.accroche{margin:2px 0 14px;color:var(--mut);font-size:15px}
#progression{display:flex;gap:6px;align-items:flex-start;margin:0 0 6px;padding:0;list-style:none}
#progression li{flex:1;min-width:0;font-size:12.5px;color:var(--mut);border-top:4px solid var(--line);padding-top:6px;line-height:1.25}
#progression li.fait{border-color:var(--acc);color:var(--ink)}
#progression li.ici{border-color:var(--acc);color:var(--ink);font-weight:700}
#progression .nom{display:none}
#progression li.ici .nom{display:block}
@media (min-width:640px){#progression .nom{display:block}}
main{display:block;padding:10px 0 24px;outline:none}
h1,h2,h3{font-family:var(--f-tit);line-height:1.2;margin:0 0 .5em}
h2{font-size:26px;text-wrap:balance}
h3{font-size:19px;margin-top:1.5em}
p{margin:.5em 0;max-width:66ch}
.aide{color:var(--mut);font-size:15px}
.etape-intro{font-size:18px;margin-bottom:18px}
.champ{margin:18px 0}
.champ>label,.champ>.lib{display:block;font-weight:650;margin-bottom:6px}
.entree{display:flex;align-items:center;gap:8px;background:var(--surf);border:1.5px solid var(--line);border-radius:10px;padding:0 12px}
.entree:focus-within{border-color:var(--acc);outline:2px solid var(--acc-t);outline-offset:0}
.entree input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:22px;font-weight:650;padding:11px 0;outline:none}
.entree .u{color:var(--mut);font-size:15px}
select,input[type=text],input[type=number]{font:inherit;color:var(--ink)}
select{width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surf)}
.puces{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
button{font:inherit;color:inherit;cursor:pointer}
.puce{border:1.5px solid var(--line);background:var(--surf);border-radius:999px;padding:7px 13px;font-size:15px;min-height:40px}
.puce[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.resume{background:var(--acc-t);border-left:5px solid var(--acc);padding:12px 14px;border-radius:0 10px 10px 0;margin:18px 0}
.resume b{font-weight:700}
input[type=range]{width:100%;accent-color:var(--acc);height:36px}
.regle{display:flex;justify-content:space-between;color:var(--mut);font-size:13.5px}
.choix{display:block;background:var(--surf);border:1.5px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin:10px 0;cursor:pointer}
.choix:has(input:checked){border-color:var(--acc);background:var(--acc-t)}
.choix .tete{display:flex;gap:10px;align-items:flex-start}
.choix input{margin-top:5px;width:20px;height:20px;accent-color:var(--acc)}
.choix .t{font-weight:700;font-size:18px}
.choix .d{color:var(--mut);font-size:15px;margin-top:2px}
.choix .stat{font-size:14px;margin-top:8px;color:var(--ink)}
.alerte{border-radius:10px;padding:11px 14px;margin:14px 0;font-size:15.5px}
.alerte.ok{background:var(--ok-t)}.alerte.warn{background:var(--warn-t)}.alerte.bad{background:var(--bad-t)}.alerte.info{background:var(--acc-t)}
.ligne{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.ligne.sortie{opacity:.55}
.ligne .l1{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ligne .nom{font-weight:700;font-size:17.5px}
.ligne .sous{color:var(--mut);font-size:14px}
.ligne .note{margin-left:auto;font-weight:700;color:var(--acc)}
.ligne ul{margin:6px 0 0;padding-left:20px;font-size:14.5px}
.ligne li.pos::marker{content:"✓ ";color:var(--ok)}
.ligne li.att::marker{content:"⚠ ";color:var(--warn)}
.ligne .act{margin-top:8px}
.petit{border:1px solid var(--line);background:var(--surf);border-radius:8px;padding:6px 11px;font-size:14px;min-height:36px}
.tablewrap{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:14.5px;background:var(--surf)}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:650;background:var(--bg);position:sticky;top:0}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:120px}
tr.moi td{background:var(--acc-t);font-weight:650}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.graphe{margin:8px 0 4px}
.graphe svg{width:100%;height:auto;display:block}
.lege{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;margin:6px 0}
.lege i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.interrupteur{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.interrupteur input{width:22px;height:22px;margin-top:3px;accent-color:var(--acc)}
details{margin:12px 0}
summary{cursor:pointer;font-weight:650;padding:6px 0}
details>div{padding:4px 0 6px}
.etapes-plan{counter-reset:p;list-style:none;padding:0;margin:0}
.etapes-plan>li{counter-increment:p;position:relative;padding:0 0 18px 46px;border-left:2px solid var(--line);margin-left:15px}
.etapes-plan>li::before{content:counter(p);position:absolute;left:-17px;top:-2px;width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:flex;align-items:center;justify-content:center;font-weight:700}
.etapes-plan>li:last-child{border-left-color:transparent}
.etapes-plan h3{margin:0 0 4px;font-size:18px}
.pied{color:var(--mut);font-size:13.5px;border-top:1px solid var(--line);padding:14px 0 90px}
.barre{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;margin:0 -16px;padding-left:16px;padding-right:16px}
.barre button{flex:1;min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--surf);font-weight:650;font-size:17px}
.barre button.primaire{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);flex:2}
.barre button[disabled]{opacity:.4;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.actions button{border:1.5px solid var(--acc);background:var(--surf);color:var(--acc);border-radius:10px;padding:10px 16px;font-weight:650;min-height:44px}
.rec{font-size:14px;color:var(--mut)}
/* ===== Marché, fiches, portefeuille, apprendre ===== */
.onglets{display:flex;gap:2px;margin:0 0 14px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.onglets a{flex:1 0 auto;justify-content:center;display:flex;align-items:center;min-height:44px;padding:0 7px;color:var(--mut);text-decoration:none;font-weight:650;font-size:14.5px;border-bottom:3px solid transparent;white-space:nowrap}
.onglets a[aria-current=page]{color:var(--acc);border-bottom-color:var(--acc)}
body:not(.vue-plan) #progression,body:not(.vue-plan) #barre{display:none}
.badge{display:inline-block;font-size:12.5px;font-weight:650;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.5}
.badge.ok{background:var(--ok-t);color:var(--ok)}.badge.warn{background:var(--warn-t);color:var(--warn)}.badge.bad{background:var(--bad-t);color:var(--bad)}.badge.info{background:var(--acc-t);color:var(--acc)}
.cartes{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px;margin:12px 0}
.carte{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.carte .k{font-size:13px;color:var(--mut)}.carte .v{font-size:20px;font-weight:700;line-height:1.3}
.val{display:flex;align-items:center;gap:4px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:4px 4px 4px 12px;margin:8px 0}
.val .lien{flex:1;min-width:0;display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none;padding:6px 0}
.val .g{flex:1;min-width:0}.val .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.val .s{font-size:13px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.val .d{text-align:right;white-space:nowrap}.val .px{font-weight:700}.val .var{font-size:14px}
.etoile{border:0;background:transparent;font-size:22px;min-width:44px;min-height:44px;color:var(--mut);border-radius:8px}.etoile[aria-pressed=true]{color:var(--warn)}
.filtres{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.outils{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.outils .entree{flex:1;min-width:200px}.outils .entree input{font-size:17px;font-weight:400}.outils select{width:auto;flex:0 0 auto}
.fiche-tete{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.fiche-tete .prix{font-size:28px;font-weight:700}
.perfs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.perfs span{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:14px}
.radar{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:12px;align-items:center}
@media (max-width:600px){.radar{grid-template-columns:1fr}}
.radar svg{width:100%;max-width:320px;height:auto;display:block;margin:0 auto}
.axes{list-style:none;padding:0;margin:0;font-size:15px}.axes li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.points{display:inline-flex;gap:3px;vertical-align:middle}.points i{width:10px;height:10px;border-radius:50%;background:var(--line)}.points i.on{background:var(--acc)}
.liste-actus{list-style:none;padding:0;margin:0}.liste-actus li{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}.liste-actus .dt{color:var(--mut);font-size:13px;display:block}
.liste-actus a{color:var(--ink)}
.retour-lien{display:inline-flex;align-items:center;min-height:44px;color:var(--acc);text-decoration:none;font-weight:650}
.form-pf{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end}
@media (max-width:600px){.form-pf{grid-template-columns:1fr 1fr}.form-pf .large{grid-column:1/-1}}
.form-pf label{font-size:13.5px;color:var(--mut);display:block;margin-bottom:4px}
.form-pf input{width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--surf);font-size:17px}
.form-pf button,.bouton{min-height:46px;border-radius:10px;border:1.5px solid var(--acc);background:var(--acc);color:var(--acc-ink);font-weight:650;padding:0 16px}
.bouton.second{background:var(--surf);color:var(--acc)}
.barres-h div{display:grid;grid-template-columns:minmax(110px,40%) 1fr 3.5em;gap:8px;align-items:center;font-size:14px;margin:4px 0}
.barres-h b{display:block;height:10px;border-radius:5px;background:var(--acc)}
.lecon summary{font-size:17px}
.lecon .aide{font-size:15.5px;color:var(--ink)}
textarea{width:100%;min-height:90px;font:14px/1.4 ui-monospace,monospace;border-radius:10px;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);padding:8px}
/* ===== Refonte : en-tete, navigation du bas, cartes ===== */
:root{--ombre:0 1px 2px rgba(20,32,46,.06),0 4px 14px rgba(20,32,46,.06);--nav-h:64px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ombre:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--ombre:0 1px 2px rgba(0,0,0,.3)}
body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
header.haut{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 0 10px}
header.haut .titres{min-width:0;flex:1}
header.haut #progression{flex-basis:100%}
.marque{display:flex;align-items:center;gap:8px}
a.marque{color:inherit;text-decoration:none;display:inline-flex}
.marque .logo-svg{flex:0 0 auto;border-radius:9px}
.marque .logo{width:30px;height:30px;border-radius:9px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font:700 15px var(--f-txt)}
.reglages{display:flex;gap:6px;flex:0 0 auto}
.reglages .bouton-ico{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surf);display:grid;place-items:center;text-decoration:none;font-size:17px;box-shadow:var(--ombre)}
.reglages button{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-weight:700;font-size:15px;box-shadow:var(--ombre)}
.basnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surf);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.basnav .in{display:flex;width:100%;max-width:760px}
.basnav a{flex:1;min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mut);text-decoration:none;font-size:11.5px;font-weight:650;position:relative}
.basnav a[aria-current=page]{color:var(--acc)}
.basnav a[aria-current=page]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
.basnav .pastille{position:absolute;top:8px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10.5px;line-height:16px;text-align:center;padding:0 4px}
.barre{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:10px}
.pied{padding-bottom:24px}
.carte,.val{box-shadow:var(--ombre)}
.hero{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 62%,#000));color:var(--acc-ink);border-radius:16px;padding:16px 18px;margin:6px 0 14px;box-shadow:var(--ombre)}
.hero h2{margin:0 0 2px;font-size:23px}
.hero .aide{color:inherit;opacity:.85;margin:0 0 10px}
.hero .chiffres-h{display:flex;gap:22px;flex-wrap:wrap}
.hero .chiffres-h div{font-size:13px;opacity:.92}
.hero .chiffres-h b{display:block;font-size:25px}
.une{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:4px 14px 8px;margin:12px 0;box-shadow:var(--ombre)}
.une h3{margin:.7em 0 .3em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.une h3 a{font:600 14px var(--f-txt);color:var(--acc);text-decoration:none;white-space:nowrap}
.annonce.neuve{border-left:3px solid var(--acc);padding-left:8px}
.bandeau{background:var(--acc-t);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px;margin:6px 0}
.avatar{flex:0 0 auto;width:42px;height:42px;border-radius:12px;background:var(--acc-t);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.3px}

/* ===== Tirer pour actualiser (application installee) ===== */
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 6px);transform:translate(-50%,-80px);z-index:30;background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:650;box-shadow:var(--ombre);display:flex;align-items:center;gap:8px;pointer-events:none;transition:transform .2s}
#ptr .rond{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--acc)}
#ptr.charge .rond{animation:tourne .8s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
@media (display-mode:standalone){html,body{overscroll-behavior-y:contain}}
.deux-champs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.deux-champs label{font-size:13px;color:var(--mut)}.deux-champs input{display:block;width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:17px;font-weight:650}
.lecon-corps{font-size:17px;line-height:1.6}.lecon-corps ul,.lecon-corps ol{padding-left:20px}.coche-q{display:flex;gap:10px;align-items:center;min-height:40px;font-size:16px;color:var(--ink)}
@media print{
  header.haut,.barre,.pied .ne-pas-imprimer,#progression,.actions,details>summary,.onglets,.basnav{display:none!important}
  body{background:#fff;color:#000;font-size:12pt}
  .page-plan-seulement{display:block}
  .ligne,.choix,table{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="haut">
    <div class="titres"><a class="marque" href="#marche" aria-label="Accueil"><svg class="logo-svg" width="32" height="32" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"> <defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3550b0"/><stop offset="1" stop-color="#1f2f6e"/></linearGradient></defs> <rect width="100" height="100" rx="24" fill="url(#gl)"/> <path d="M30 74V30L64 72" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/> <path d="M68 74V36" fill="none" stroke="#f2b632" stroke-width="11" stroke-linecap="round"/> <path d="M56 40L68 24L80 40Z" fill="#f2b632" stroke="#f2b632" stroke-width="4" stroke-linejoin="round"/></svg><span>NAFA</span></a>
    <p class="accroche" id="accroche"></p></div>
    <div class="reglages"><a class="bouton-ico" id="b-compte" href="#moncompte" aria-label="Se connecter">👤</a><button type="button" id="b-langue"></button><button type="button" id="b-theme"></button></div>
    <ol id="progression" aria-label="Étapes"></ol>
  </header>
  <main id="contenu" tabindex="-1"></main>
  <footer class="pied">
    <p><span id="avert"></span> <span id="maj"></span>.</p>

const plafond = (part, n, mini = 1) => Math.max(mini, Math.floor(part * n + 1e-9));
function limites(profil, n) { const P = PROFILS[profil], mini = n >= 3 ? 2 : 1; return [plafond(P.groupe, n), plafond(P.secteur, n, mini), plafond(P.pays, n, mini)]; }
function rang(vals) {
  const o = vals.filter(v => v != null && !isNaN(v)).sort((a, b) => a - b);
  return vals.map(v => { if (v == null || isNaN(v) || !o.length) return 0.4; let inf = 0, eg = 0; o.forEach(x => { if (x < v) inf++; else if (x === v) eg++; }); return (inf + 0.5 * eg) / o.length; });
}
const cl = (v, a, b) => (v == null || isNaN(v)) ? 0 : Math.max(a, Math.min(b, v));
function calculerMixte(base, partDiv) {
  const y = rang(base.map(c => c.rend_moy)), g = rang(base.map(c => 0.5 * cl(c.croiss3, -0.2, 0.3) + 0.5 * cl(c.p1a, -0.2, 0.6)));

function selection(profil, n, partDiv, exclus) {

  if (P.cle === "mixte") calculerMixte(base, partDiv);
  base.sort((a, b) => (b[P.cle] == null ? -1e9 : b[P.cle]) - (a[P.cle] == null ? -1e9 : a[P.cle]));

  base.forEach(c => {

  });

/* ===== Projection (mois par mois) ===== */
function rendementPortefeuille(sel) {

}
function projeter(o) {
  const M = Math.round(o.H * 12), f = o.tout / 100, mp = Math.pow(1 + o.gp, 1 / 12) - 1, per = PERIODES[o.freq], infl = o.reel ? o.infl / 100 : 0;
  let V = o.A0 * (1 - f), cash = 0, verse = o.A0, versReel = o.A0, frais = o.A0 * f, div = 0, dernierDiv = 0, plusDiv = 0;
  const pts = [{ m: 0, verse, versReel, val: V * (1 - f) + cash, frais, div }];
  for (let m = 1; m <= M; m++) {
    V *= (1 + mp);
    if (o.C > 0 && m % per === 0) { V += o.C * (1 - f); verse += o.C; versReel += o.C / Math.pow(1 + infl, m / 12); frais += o.C * f; }
    const rec = V * o.garde / 100 / 12 + (o.tenue * o.n + o.fixe) / 12;
    const r = Math.min(V, rec); V -= r; frais += r;
    if (m % 12 === 7) {
      const an = Math.floor((m - 1) / 12), y = o.y0 * Math.pow((1 + o.gd) / (1 + o.gp), an), D = V * y * (1 - o.impot / 100);
      div += D; dernierDiv = D;
      if (o.reinvest) { V += D * (1 - f); frais += D * f; } else cash += D;
    }
    if (o.krach && m === 24) V *= 0.70;
    const deflate = Math.pow(1 + infl, m / 12);
    pts.push({ m, verse, versReel: o.reel ? versReel : verse, val: (V * (1 - f) + cash) / deflate, frais, div, valBrute: V + cash });

}

/* ===== Placement sans risque (comparaison) ===== */
function sansRisque(o) {
  const M = Math.round(o.H * 12), r = Math.pow(1 + o.taux / 100, 1 / 12) - 1, per = PERIODES[o.freq], infl = o.reel ? o.infl / 100 : 0;
  let B = o.A0; const pts = [{ m: 0, val: B }];

}

function premierAchat(sel) {

}
function planVersements(sel, nb) {

  const k = clamp(Math.floor(S.contrib / S.ordreMin), 1, n), out = [];

function composition(sel) {

  const sec = cnt(c => c.secteur), pays = cnt(c => c.pays), grp = cnt(groupeDe), n = sel.length, al = [];
  Object.entries(sec).forEach(([k, v]) => { if (n >= 3 && v / n > 0.5) al.push(k + " : " + Math.round(100 * v / n) + " % des sociétés"); });
  Object.entries(pays).forEach(([k, v]) => { if (n >= 3 && v / n > 0.70) al.push(k + " : " + Math.round(100 * v / n) + " % des sociétés"); });
  Object.entries(grp).forEach(([k, v]) => { if (v >= 3) al.push(v + " sociétés du groupe " + k); });
  return { sec: txt(sec), pays: txt(pays), grp: txt(grp), al };
}

/* --- Étape 5 : projection --- */
function grapheSVG(sc, maxM, annee, W) {
  W = W || 720; const H = W < 520 ? 300 : 320, L = W < 520 ? 52 : 62, R = 12, T = 12, B = 30, xs = m => L + (W - L - R) * m / maxM;
  const maxY = Math.max(...sc.fav.pts.map(p => p.val), ...sc.verse.map(p => p.versReel), ...sc.sr.pts.map(p => p.val), 1) * 1.05;
  const ys = v => T + (H - T - B) * (1 - v / maxY);
  const ligne = (arr, key) => arr.map((p, i) => (i ? "L" : "M") + xs(p.m).toFixed(1) + " " + ys(p[key]).toFixed(1)).join(" ");
  const pas = Math.max(1, Math.ceil(S.horizon / 6));
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution possible de votre épargne selon quatre scénarios">`;
  for (let k = 0; k <= 4; k++) { const v = maxY * k / 4, y = ys(v); g += `<line x1="${L}" y1="${y}" x2="${W - R}" y2="${y}" stroke="var(--line)"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" font-size="11.5" fill="var(--mut)">${v === 0 ? "0" : v >= 1e6 ? (v / 1e6).toFixed(v >= 1e7 ? 0 : 1).replace(".", ",") + " M" : fmt(v / 1000) + " k"}</text>`; }
  for (let a = 0; a <= S.horizon; a += pas) g += `<text x="${xs(a * 12)}" y="${H - 8}" text-anchor="middle" font-size="11.5" fill="var(--mut)">${a} an${a > 1 ? "s" : ""}</text>`;
  const bande = sc.fav.pts.map((p, i) => (i ? "L" : "M") + xs(p.m).toFixed(1) + " " + ys(p.val).toFixed(1)).join(" ") + " " + sc.dif.pts.slice().reverse().map(p => "L" + xs(p.m).toFixed(1) + " " + ys(p.val).toFixed(1)).join(" ") + " Z";
  g += `<path d="${bande}" fill="var(--c-cent)" opacity=".12"/>`;
  g += `<path d="${ligne(sc.verse, "versReel")}" fill="none" stroke="var(--c-verse)" stroke-width="2" stroke-dasharray="5 4"/>`;
  g += `<path d="${ligne(sc.sr.pts, "val")}" fill="none" stroke="var(--c-sr)" stroke-width="2" stroke-dasharray="2 4"/>`;
  g += `<path d="${ligne(sc.dif.pts, "val")}" fill="none" stroke="var(--c-dif)" stroke-width="2"/>`;
  g += `<path d="${ligne(sc.prud.pts, "val")}" fill="none" stroke="var(--c-prud)" stroke-width="2"/>`;
  g += `<path d="${ligne(sc.fav.pts, "val")}" fill="none" stroke="var(--c-fav)" stroke-width="2"/>`;
  g += `<path d="${ligne(sc.cent.pts, "val")}" fill="none" stroke="var(--c-cent)" stroke-width="3.2"/>`;
  const x = xs(annee * 12); g += `<line x1="${x}" y1="${T}" x2="${x}" y2="${H - B}" stroke="var(--ink)" stroke-width="1" opacity=".5"/></svg>`;
  return g;
}

/* --- Chiffres clés tirés des états financiers + calculateur de valeur --- */
const fmtd = (n, d = 0) => { if (n == null || isNaN(n)) return "–"; const s = Math.abs(n).toFixed(d).split("."); return (n < 0 ? "–" : "") + s[0].replace(/\B(?=(\d{3})+(?!\d))/g, NB) + (s[1] && +s[1] ? "," + s[1] : ""); };
const mds = x => x == null ? "–" : Math.abs(x) >= 1e9 ? fmtd(x / 1e9, Math.abs(x) >= 1e11 ? 0 : 1) + " Mds" : fmtd(x / 1e6) + " M";
const LIGNES_FOND = {
  syscohada: [["ca", "Chiffre d’affaires"], ["res_exploitation", "Résultat d’exploitation"], ["res_financier", "Résultat financier"], ["res_net", "Bénéfice net"], ["capitaux_propres", "Capitaux propres"], ["tresorerie_actif", "Trésorerie"]],
  ifrs: [["ca", "Chiffre d’affaires"], ["res_exploitation", "Résultat d’exploitation"], ["res_net_part_groupe", "Bénéfice net (part du groupe)"], ["capitaux_propres", "Capitaux propres (part du groupe)"], ["tresorerie", "Trésorerie"]],
  banque: [["pnb", "Produit net bancaire"], ["frais_generaux", "Frais généraux"], ["cout_risque", "Coût du risque"], ["res_net", "Bénéfice net"], ["capitaux_propres", "Capitaux propres"], ["credits_clientele", "Crédits à la clientèle"]]
};
function ratiosFond(c) {
  const f = c.fond, b = f.n[f.benef], nb = f.nb_actions, cp = f.n.capitaux_propres, r = {};
  if (nb && b != null) { r.bpa = b / nb; r.per = r.bpa > 0 ? c.prix / r.bpa : null; }
  if (f.dpa) { r.rdt = f.dpa / c.prix; if (r.bpa > 0) r.distrib = f.dpa / r.bpa; }
  if (nb && cp > 0) { r.pb = c.prix * nb / cp; if (b != null) r.roe = b / cp; }
  r.douteux = r.per != null && (r.per < 2 || r.per > 1000);
  return r;
}
function blocFond(c) {
  const f = c.fond;
  if (!f) return `<h3>Chiffres clés</h3><p class="aide">Pas encore d’états financiers analysés pour cette société. Ils s’ajouteront automatiquement à leur prochaine publication.</p>`;
  const r = ratiosFond(c), b = f.n[f.benef], b1 = f.n1[f.benef];
  const lignes = (LIGNES_FOND[f.norme] || LIGNES_FOND.syscohada).filter(([k]) => f.n[k] != null);
  const vb = b > 0 && b1 > 0 ? (b + b1) / 2 : Math.max(b || 0, b1 || 0);
  return `<h3>${tr("chiffres")} ${f.an}</h3>
  ${(f.alertes || []).length ? `<div class="alerte bad"><ul style="margin:0;padding-left:18px">${f.alertes.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
  ${f.a_verifier || r.douteux ? `<div class="alerte warn"><b>À vérifier :</b> ${esc(f.notes.concat(f.controles_ko).join(" ") || "certains chiffres semblent incohérents avec le cours.")}${r.douteux && !f.notes.length ? " Le rapport par action ne correspond pas au cours actuel : nombre d’actions à confirmer." : ""}</div>` : ""}
  <div class="tablewrap"><table><thead><tr><th>En FCFA</th><th>${f.an}</th><th>${f.an - 1}</th><th>Var.</th></tr></thead><tbody>
  ${lignes.map(([k, l]) => { const a = f.n[k], p = f.n1[k], v = a != null && p ? (a - p) / Math.abs(p) : null; return `<tr><td>${l}</td><td>${mds(a)}</td><td>${mds(p)}</td><td class="${cls(v)}">${v == null ? "–" : pcs(v, 0)}</td></tr>`; }).join("")}
  </tbody></table></div>

    ${r.bpa != null ? `<span>Bénéfice par action : <b>${fmtd(r.bpa, r.bpa < 100 ? 1 : 0)}</b></span>` : ""}

    ${r.roe != null ? `<span>Rentabilité des fonds propres : <b>${pc(r.roe, 0)}</b></span>` : ""}

  <p class="aide">Source : ${f.url ? lienExt(f.url, "états financiers publiés") : "états financiers publiés"} (${esc(f.norme === "ifrs" ? "comptes consolidés IFRS" : f.norme === "banque" ? "plan comptable bancaire" : "SYSCOHADA")}), lus automatiquement et contrôlés par recoupement.</p>
  `;

/* --- Évaluer le prix : deux lectures simples (bénéfices et dividende) --- */
const PER_BRVM = (() => {
  const v = DATA.stocks.filter(c => c.fond && c.fond.nb_actions && c.fond.n[c.fond.benef] > 0).map(c => c.prix / (c.fond.n[c.fond.benef] / c.fond.nb_actions)).filter(x => x > 2 && x < 40).sort((a, b) => a - b);
  return v.length ? { med: Math.round(v[Math.floor(v.length / 2)] * 10) / 10, n: v.length } : { med: 10, n: 0 };
})();
const dernierDiv = c => { if (c.fond && c.fond.dpa) return { m: c.fond.dpa, lib: "dividende proposé pour " + c.fond.an }; const d = dernierDividende(c); return d ? { m: d.m, lib: "dernier dividende versé (" + d.an + ")" } : null; };
const v1 = x => String(Math.round(x * 10) / 10).replace(".", ",");
function blocEval(c) {
  const f = c.fond, nb = f && f.nb_actions, b = f ? f.n[f.benef] : null, b1 = f ? f.n1[f.benef] : null;
  const vb = b > 0 && b1 > 0 ? (b + b1) / 2 : Math.max(b || 0, b1 || 0);
  const okB = !!(nb && vb > 0), dv = dernierDiv(c);
  if (!okB && !dv) return "";
  const perAct = okB && b > 0 ? c.prix / (b / nb) : null;
  const verdict = [perAct ? `Au cours actuel, vous payez <b>${v1(perAct)} années de bénéfices</b>${PER_BRVM.n ? ` (moyenne BRVM : ${v1(PER_BRVM.med)})` : ""}.` : "",
    dv ? `Le ${dv.lib} représente <b>${pc(dv.m / c.prix)}</b> du cours.` : ""].filter(Boolean).join(" ");
  const choix = (id, opts) => `<div class="puces" role="group">${opts.map(([v, l], i) => `<button type="button" class="puce" data-${id}="${v}" aria-pressed="${i === 1}">${l}</button>`).join("")}</div>`;
  return `<h3>Le prix est-il raisonnable ?</h3>
  <div class="alerte info">${verdict}</div>
  ${okB ? `<div class="carte" style="margin:12px 0"><b>1. Par les bénéfices</b>
    <p class="aide" style="margin:.3em 0">Combien d’années de bénéfices acceptez-vous de payer pour posséder l’entreprise ?</p>
    ${choix("ans", [[8, "Prudent · 8 ans"], [PER_BRVM.med, "Moyenne BRVM · " + v1(PER_BRVM.med) + " ans"], [14, "Optimiste · 14 ans"]])}
    <div class="deux-champs"><label>Années <input id="ev-ans" inputmode="decimal" value="${v1(PER_BRVM.med)}"></label><label>Bénéfice annuel normal (Mds FCFA) <input id="ev-b" inputmode="decimal" value="${v1(vb / 1e9)}"></label></div>
    <p class="aide" style="margin:.2em 0">Bénéfice proposé : moyenne des deux derniers exercices, pour lisser une année exceptionnelle.</p>
    <div id="ev-res1" aria-live="polite"></div></div>` : ""}
  ${dv ? `<div class="carte" style="margin:12px 0"><b>${okB ? "2" : "1"}. Par le dividende</b>
    <p class="aide" style="margin:.3em 0">Quel rendement annuel attendez-vous de votre argent ? (${esc(dv.lib)} : ${fmt(dv.m)} FCFA par action)</p>
    ${choix("rdt", [[5, "5 %"], [7, "7 %"], [9, "9 %"]])}
    <div class="deux-champs"><label>Rendement souhaité (%) <input id="ev-r" inputmode="decimal" value="7"></label></div>
    <div id="ev-res2" aria-live="polite"></div></div>` : ""}
  <details><summary>Comment est-ce calculé ?</summary><div class="aide">
    ${okB ? `<p><b>Par les bénéfices</b> : prix raisonnable = bénéfice annuel × nombre d’années ÷ nombre d’actions. Ici : ${v1(vb / 1e9)} Mds × ${v1(PER_BRVM.med)} ÷ ${fmt(nb)} actions = ${fmt(vb * PER_BRVM.med / nb)} FCFA. C’est le principe du PER (cours ÷ bénéfice par action).</p>` : ""}
    ${dv ? `<p><b>Par le dividende</b> : prix maximum = dividende ÷ rendement souhaité. Ici : ${fmt(dv.m)} ÷ 7 % = ${fmt(dv.m / 0.07)} FCFA. Payer plus cher que ce prix, c’est accepter un rendement plus faible.</p>` : ""}
    <p>Ces calculs supposent que les bénéfices et dividendes passés se maintiennent. Ils ne tiennent pas compte d’une offre de rachat, de la dette ni des perspectives : ce sont des repères pour réfléchir, pas des recommandations.</p></div></details>`;
}
function brancherEval(c) {
  const f = c.fond, nb = f && f.nb_actions, dv = dernierDiv(c), num = s => parseFloat(String(($(s) || {}).value || "").replace(",", ".")) || 0;
  const ligne = (val, txt) => { const e = val / c.prix - 1; return `<div class="cartes"><div class="carte"><div class="k">${txt}</div><div class="v">${fcfa(val)}</div></div><div class="carte"><div class="k">Par rapport au cours (${fmt(c.prix)})</div><div class="v ${cls(e)}">${e >= 0 ? "marge de " + pc(e, 0) : "cours " + pc(-e, 0) + " au-dessus"}</div></div></div>`; };
  const calc1 = () => { if (!$("#ev-res1")) return; const B = num("#ev-b") * 1e9, a = num("#ev-ans"); if (!(B > 0 && a > 0)) { $("#ev-res1").innerHTML = ""; return; }
    $("#ev-res1").innerHTML = ligne(B * a / nb, "Prix raisonnable à " + v1(a) + " ans") + `<p class="aide">Pour justifier le cours à ${v1(a)} ans, il faudrait un bénéfice d’environ <b>${v1(c.prix * nb / a / 1e9)} Mds FCFA</b>.</p>`; };

  document.querySelectorAll("[data-rdt]").forEach(btn => btn.addEventListener("click", () => { $("#ev-r").value = btn.dataset.rdt; document.querySelectorAll("[data-rdt]").forEach(x => x.setAttribute("aria-pressed", String(x === btn))); calc2(); }));

function brancherCalculateur(c) {
  const f = c.fond; if (!f || !$("#cv-b")) return;
  const calc = () => {
    const B = (parseFloat(String($("#cv-b").value).replace(",", ".")) || 0) * 1e9, m = parseFloat(String($("#cv-m").value).replace(",", ".")) || 0, nb = f.nb_actions;
    if (B <= 0 || m <= 0) { $("#cv-res").innerHTML = `<p class="aide">Indiquez un bénéfice et un multiple positifs.</p>`; return; }
    const val = B * m / nb, paye = c.prix * nb / B, ecart = val / c.prix - 1, bas = B * Math.max(1, m - 2) / nb, haut = B * (m + 2) / nb;
    $("#cv-res").innerHTML = `<div class="cartes">
      <div class="carte"><div class="k">Valeur par action selon vos hypothèses</div><div class="v">${fcfa(val)}</div><div class="k">fourchette ${fmtd(bas)} à ${fmtd(haut)} (multiple ${Math.max(1, m - 2)} à ${m + 2})</div></div>
      <div class="carte"><div class="k">Écart avec le cours (${fmtd(c.prix)})</div><div class="v ${cls(ecart)}">${pcs(ecart, 0)}</div></div></div>
      <p>Au cours actuel, le marché paie <b>${fmtd(paye, 1)} fois</b> ce bénéfice. À ${String(m).replace(".", ",")} fois, il faudrait un bénéfice d’environ <b>${fmtd(c.prix * nb / m / 1e9, 1)} milliards</b> pour justifier le cours.</p>
      <p class="aide">Repère : sur la BRVM, beaucoup de sociétés stables se paient entre 8 et 14 fois leur bénéfice. Ce calcul ne tient pas compte d’une éventuelle offre de rachat, de la dette ni des perspectives : c’est un outil de réflexion, pas une recommandation.</p>`;

/* ===== Tirer vers le bas pour actualiser (uniquement dans l'application installee) ===== */
(function () {
  const installee = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  if (!installee || !("ontouchstart" in window)) return;
  const el = $("#ptr"), txt = $("#ptr-txt"), SEUIL = 80;
  let y0 = null, dy = 0, actif = false;
  const montrer = (d, msg) => { el.style.transform = `translate(-50%, ${Math.min(d, 110) - 80}px)`; txt.textContent = msg; };
  window.addEventListener("touchstart", e => {
    if (window.scrollY > 0 || e.touches.length !== 1 || e.target.closest("input,select,textarea,.tablewrap,.graphe")) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0; actif = false;
  }, { passive: true });
  window.addEventListener("touchmove", e => {
    if (y0 == null) return;
    dy = (e.touches[0].clientY - y0) * 0.55;
    if (dy <= 0) { el.style.transform = ""; return; }
    actif = true; montrer(dy, dy > SEUIL ? tr("ptr_lacher") : tr("ptr_tirer") + " · " + tr("ptr_info") + " " + DATA.maj);
  }, { passive: true });
  window.addEventListener("touchend", () => {
    if (y0 == null || !actif) { y0 = null; return; }
    if (dy > SEUIL) { el.classList.add("charge"); montrer(SEUIL + 30, tr("ptr_charge")); setTimeout(() => location.reload(), 150); }
    else el.style.transform = "";
    y0 = null; actif = false;
  });
})();

const fiche = t => STOCK[t] ? `<a href="#valeur-${t}">${esc(STOCK[t].nom)}</a>` : esc(t);
const mdsA = x => x == null ? "–" : (Math.abs(x) >= 1e9 ? v1(x / 1e9) + " Mds" : fmt(x / 1e6) + " M") + " FCFA";
const fF = (t, k, n1) => { const c = STOCK[t]; return c && c.fond ? (n1 ? c.fond.n1 : c.fond.n)[k] : null; };
const sgiRef = () => DATA.fees.find(f => f.id === "sgimali") || DATA.fees[0];
const NIVEAUX = [
 { id: "n1", titre: "Niveau 1 · Les bases", badge: "🌱 Initié", intro: "Comprendre la bourse régionale et savoir comment on investit concrètement.", lecons: [
  { id: "n1-1", titre: "La bourse et la BRVM", texte: () => `<p>Une bourse est un marché où l’on achète et vend des titres financiers : des <b>actions</b> (des parts d’entreprises) et des <b>obligations</b> (des prêts). La <b>BRVM</b>, la Bourse régionale des valeurs mobilières, est commune aux <b>8 pays de l’UEMOA</b> : Bénin, Burkina Faso, Côte d’Ivoire, Guinée-Bissau, Mali, Niger, Sénégal et Togo. Son siège est à Abidjan.</p><p>Elle compte aujourd’hui environ ${DATA.stocks.length} sociétés cotées, plus de nombreuses obligations d’États et d’entreprises. Le marché est surveillé par l’<b>AMF-UMOA</b>, le régulateur régional, et les titres sont conservés par le <b>DC/BR</b>, le dépositaire central.</p>`,
    quiz: [["Combien de pays partagent la BRVM ?", ["5", "8", "15"], 1, "Les 8 pays de l’UEMOA."], ["Qui surveille le marché financier régional ?", ["La BCEAO", "L’AMF-UMOA", "Chaque État séparément"], 1, "L’AMF-UMOA (ancien CREPMF) est le régulateur du marché."], ["Une action, c’est…", ["un prêt à une entreprise", "une part d’une entreprise", "un compte d’épargne"], 1, "Une action est une part de propriété ; une obligation est un prêt."]] },
  { id: "n1-2", titre: "Action ou obligation ?", texte: () => `<p><b>L’action</b> fait de vous un petit propriétaire. Vous gagnez si l’entreprise verse un <b>dividende</b> et si son cours monte. Mais rien n’est garanti : le dividende peut baisser et le cours peut chuter.</p><p><b>L’obligation</b> fait de vous un prêteur. L’émetteur (un État ou une entreprise) vous verse un <b>intérêt fixé à l’avance</b>, le coupon, puis vous rembourse à l’échéance. Le risque est plus faible, mais pas nul : l’émetteur peut avoir des difficultés.</p><p>En résumé : l’action vise la croissance avec plus de risque, l’obligation un revenu régulier avec moins de risque. Beaucoup d’épargnants combinent les deux.</p>`,
    quiz: [["Le coupon d’une obligation est…", ["variable chaque année", "fixé à l’avance", "décidé par la BRVM"], 1, "Le taux d’intérêt est connu dès l’émission."], ["Le dividende d’une action est…", ["garanti", "décidé chaque année par l’assemblée générale", "toujours égal à 10 %"], 1, "Il dépend des bénéfices et de la décision des actionnaires."], ["Quel placement est en général le moins risqué ?", ["Une action", "Une obligation d’État", "Les deux se valent"], 1, "Une obligation d’État reste en général moins risquée qu’une action, sans être sans risque."]] },
  { id: "n1-3", titre: "La SGI et le compte-titres", texte: () => `<p>On n’achète pas directement à la BRVM : il faut passer par une <b>SGI</b> (société de gestion et d’intermédiation) agréée. Elle ouvre votre <b>compte-titres</b>, passe vos ordres et fait conserver vos titres.</p><p>Pour ouvrir un compte, on fournit en général une pièce d’identité, un justificatif de domicile, parfois une photo, et on remplit un questionnaire sur son profil d’investisseur. On dépose ensuite de l’argent sur le compte espèces associé.</p><p>Choisissez une SGI selon ses <b>frais</b>, la qualité de son service et sa facilité d’accès depuis votre pays. L’onglet <a href="#plan">Plan</a> compare les frais de ${DATA.fees.length} SGI.</p>`,
    quiz: [["Qui passe vos ordres en bourse ?", ["La BRVM", "Votre SGI", "Votre banque centrale"], 1, "Seule une SGI agréée transmet les ordres au marché."], ["Que faut-il en général pour ouvrir un compte ?", ["Une pièce d’identité et un justificatif de domicile", "Un diplôme", "Rien"], 0, "C’est la règle de connaissance du client."], ["Où sont conservés vos titres ?", ["Chez vous, sur papier", "Inscrits en compte via la SGI et le dépositaire central", "À la BCEAO"], 1, "Les titres sont dématérialisés et inscrits en compte."]] },
  { id: "n1-4", titre: "Passer un ordre", texte: () => `<p>Un ordre précise : le <b>sens</b> (achat ou vente), le <b>titre</b>, la <b>quantité</b>, le <b>prix</b> et la <b>durée de validité</b>.</p><p>Avec un ordre <b>à cours limité</b>, vous fixez le prix maximum à l’achat (ou minimum à la vente). C’est le choix le plus sûr sur un marché où certaines sociétés s’échangent peu. Avec un ordre <b>au marché</b>, vous acceptez le prix disponible : rapide, mais vous risquez de payer cher.</p><p>À la BRVM, la variation du cours d’une action est en principe limitée à <b>±7,5 % par séance</b>. Si personne ne vend à votre prix, votre ordre attend, parfois plusieurs jours.</p>`,
    quiz: [["Quel ordre protège le mieux votre prix ?", ["Au marché", "À cours limité", "Les deux se valent"], 1, "Vous fixez vous-même le prix maximum ou minimum."], ["Votre ordre d’achat à 5 000 FCFA n’est pas exécuté. Pourquoi ?", ["La SGI l’a oublié", "Aucun vendeur n’accepte ce prix pour l’instant", "C’est interdit"], 1, "Il faut un vendeur à votre prix ; l’ordre reste en attente pendant sa durée de validité."], ["Que précise un ordre ?", ["Seulement le titre", "Sens, titre, quantité, prix et validité", "Votre salaire"], 1, "Ces cinq éléments définissent l’ordre."]] },
  { id: "n1-5", titre: "Les frais", texte: () => { const f = sgiRef(), m = 1000000; return `<p>Investir a un coût. Les principaux frais sont :</p><ul><li><b>le courtage</b>, prélevé à chaque achat et vente, qui inclut des commissions de la BRVM et du dépositaire ;</li><li><b>les droits de garde</b>, un pourcentage annuel de la valeur de vos titres ;</li><li><b>la tenue de compte</b>, un montant fixe, parfois par ligne détenue.</li></ul><p>Exemple avec la grille enregistrée pour ${esc(f.nom)} : pour un achat de ${fmt(m)} FCFA, le courtage tout compris d’environ ${v1(f.tout)} % coûte environ <b>${fmt(m * f.tout / 100)} FCFA</b>, et la garde environ ${fmt(m * f.garde / 100)} FCFA par an.</p><p>Conséquence : acheter et revendre souvent coûte cher. Pour de petits montants, les frais fixes pèsent lourd.</p>`; },
    quiz: [["Le courtage est payé…", ["une fois par an", "à chaque achat et vente", "jamais"], 1, "C’est une commission par opération."], ["Les droits de garde dépendent…", ["de la valeur de vos titres", "de votre âge", "du nombre de SGI"], 0, "C’est un pourcentage annuel de la valeur conservée."], ["Pourquoi éviter d’acheter et vendre très souvent ?", ["C’est interdit", "Les frais s’accumulent", "Les dividendes sont supprimés"], 1, "Chaque aller-retour paie deux fois le courtage."]] },
  { id: "n1-6", titre: "L’impôt sur vos revenus", texte: () => `<p>Les <b>dividendes</b> sont en général imposés <b>à la source</b> : la société retient l’impôt avant de vous payer. Cet impôt s’appelle souvent l’IRVM. Par exemple, Sonatel indique dans ses comptes 2025 une retenue de 10 % : 1 933 FCFA brut deviennent 1 740 FCFA net.</p><p>Les <b>intérêts des obligations</b> sont eux aussi imposés, parfois avec des exonérations pour les emprunts d’État.</p><p>Les taux dépendent du pays de l’émetteur et parfois du vôtre : demandez-les à votre SGI. Dans NAFA, indiquez votre taux dans le portefeuille pour voir des revenus nets.</p>`,
    quiz: [["L’impôt sur les dividendes est en général…", ["payé par vous en fin d’année", "retenu à la source", "inexistant"], 1, "La société le retient avant de verser le dividende."], ["Sonatel : 1 933 FCFA brut avec 10 % de retenue donnent…", ["1 933 FCFA", "1 740 FCFA", "193 FCFA"], 1, "1 933 × 0,9 ≈ 1 740 FCFA."], ["Qui connaît le taux exact qui vous concerne ?", ["Votre SGI", "La météo", "Personne"], 0, "Il dépend des pays : votre SGI vous le précise."]] } ] },
 { id: "n2", titre: "Niveau 2 · Analyser une société", badge: "🔎 Analyste", intro: "Lire les comptes, juger le prix et repérer les signaux d’alerte, avec des cas réels de la BRVM.", lecons: [
  { id: "n2-1", titre: "Lire un compte de résultat", texte: () => `<p>Le compte de résultat (format SYSCOHADA) se lit <b>en escalier</b> :</p><ol><li><b>Chiffre d’affaires</b> : ce que l’entreprise vend.</li><li><b>Résultat d’exploitation</b> : ce que rapporte son activité propre.</li><li><b>Résultat financier</b> : intérêts, dividendes reçus des filiales.</li><li><b>Résultat HAO</b> (hors activités ordinaires) : l’exceptionnel, comme la vente d’un bâtiment.</li><li>Moins l’impôt, on obtient le <b>résultat net</b>, le bénéfice.</li></ol><div class="alerte info"><b>Cas réel : ${fiche("SDSC")}.</b> En 2025, le chiffre d’affaires monte à ${mdsA(fF("SDSC", "ca"))}, mais le résultat d’exploitation est négatif (${mdsA(fF("SDSC", "res_exploitation"))}) et le bénéfice tombe à ${mdsA(fF("SDSC", "res_net"))}, contre ${mdsA(fF("SDSC", "res_net", 1))} en 2024 : les dividendes de ses filiales ont été reportés. Un titre « bénéfice –96 % » serait donc trompeur.</div>`,
    quiz: [["Quel étage montre la performance de l’activité propre ?", ["Le résultat d’exploitation", "Le résultat HAO", "Le chiffre d’affaires"], 0, "Il mesure ce que rapporte le métier de l’entreprise."], ["Un bénéfice gonflé par la vente d’un bâtiment apparaît dans…", ["le résultat HAO", "le chiffre d’affaires", "le résultat d’exploitation"], 0, "C’est un élément exceptionnel, hors activités ordinaires."], ["Pour AGL en 2025, le bénéfice vient surtout…", ["de son activité propre", "des produits financiers (filiales)", "de la vente d’actions"], 1, "Son exploitation est négative ; ce sont les dividendes des filiales qui comptent."]] },
  { id: "n2-2", titre: "Lire les comptes d’une banque", texte: () => `<p>Une banque se lit autrement :</p><ul><li><b>Produit net bancaire (PNB)</b> : ses revenus (marge sur les crédits, commissions).</li><li><b>Frais généraux</b> : salaires, agences, informatique.</li><li><b>Coût du risque</b> : les crédits qu’elle ne pense pas récupérer. C’est l’indicateur clé.</li><li>Puis l’impôt et le <b>résultat net</b>.</li></ul><div class="alerte warn"><b>Cas réel : ${fiche("BOAN")}.</b> Son PNB est stable (${mdsA(fF("BOAN", "pnb"))}), mais les frais et le coût du risque (${mdsA(fF("BOAN", "cout_risque"))}) font tomber le bénéfice à ${mdsA(fF("BOAN", "res_net"))}, contre ${mdsA(fF("BOAN", "res_net", 1))} un an plus tôt.</div><div class="alerte ok"><b>À l’inverse : ${fiche("CBIBF")}.</b> La baisse du coût du risque fait monter le bénéfice à ${mdsA(fF("CBIBF", "res_net"))}.</div>`,
    quiz: [["Le PNB d’une banque, c’est…", ["son bénéfice", "ses revenus d’activité", "ses dépôts"], 1, "C’est l’équivalent de son chiffre d’affaires."], ["Le coût du risque mesure…", ["les crédits qu’elle risque de ne pas récupérer", "le prix de ses actions", "ses impôts"], 0, "C’est la charge des crédits douteux."], ["Pourquoi le bénéfice de BOA Niger chute-t-il ?", ["Son PNB s’effondre", "Frais et coût du risque augmentent", "Elle a vendu ses agences"], 1, "Le PNB est stable ; ce sont les charges et le risque qui pèsent."]] },
  { id: "n2-3", titre: "Le dividende", texte: () => `<p>Le <b>rendement</b> du dividende = dividende ÷ cours. Une action à 10 000 FCFA qui verse 700 FCFA rapporte 7 %.</p><p>Pour le toucher, il faut détenir l’action avant la <b>date de détachement</b>. Ce jour-là, le cours baisse en général d’environ le montant du dividende : acheter la veille n’est pas un gain gratuit.</p><p>Regardez aussi la part du bénéfice distribuée. Au-delà de 100 %, la société puise dans ses réserves : possible un temps, pas éternellement.</p><div class="alerte info"><b>Cas réel : ${fiche("ABJC")}.</b> Pour 2025, le dividende proposé (${mdsA(STOCK.ABJC && STOCK.ABJC.fond ? 1500000000 : null)}) dépasse le bénéfice (${mdsA(fF("ABJC", "res_net"))}) : il est financé par les réserves.</div>`,
    quiz: [["Une action à 20 000 FCFA verse 1 200 FCFA. Rendement ?", ["6 %", "12 %", "1,2 %"], 0, "1 200 ÷ 20 000 = 6 %."], ["Le jour du détachement, le cours…", ["monte du montant du dividende", "baisse en général d’environ le montant du dividende", "ne bouge jamais"], 1, "La valeur du dividende sort de l’entreprise."], ["Un dividende supérieur au bénéfice signifie…", ["une erreur", "que la société puise dans ses réserves", "que l’impôt est nul"], 1, "C’est tenable un temps seulement."]] },
  { id: "n2-4", titre: "Le prix est-il raisonnable ?", texte: () => { const c = STOCK.SGBC, f = c && c.fond, per = f && f.nb_actions ? c.prix / (f.n[f.benef] / f.nb_actions) : null; return `<p>Acheter une action, c’est acheter une part des bénéfices futurs. La question devient : <b>combien d’années de bénéfices acceptez-vous de payer ?</b> C’est le PER (cours ÷ bénéfice par action).</p><p>Une autre lecture, souvent plus parlante : <b>quel rendement de dividende voulez-vous ?</b> Prix maximum = dividende ÷ rendement souhaité.</p>${per ? `<div class="alerte info"><b>Cas réel : ${fiche("SGBC")}.</b> Au cours de ${fmt(c.prix)} FCFA, vous payez environ <b>${v1(per)} années</b> de bénéfices. Ouvrez sa fiche et testez « Le prix est-il raisonnable ? » avec vos propres hypothèses.</div>` : ""}<p>Aucune méthode n’est parfaite : elles supposent que le passé se répète. Ce sont des repères pour réfléchir.</p>`; },
    quiz: [["Un PER de 10 signifie que vous payez…", ["10 FCFA par action", "10 années de bénéfices", "10 % de rendement"], 1, "Cours = 10 × bénéfice par action."], ["Dividende 700 FCFA, rendement souhaité 7 %. Prix maximum ?", ["7 000 FCFA", "10 000 FCFA", "4 900 FCFA"], 1, "700 ÷ 0,07 = 10 000 FCFA."], ["Ces méthodes…", ["prédisent l’avenir", "sont des repères fondés sur le passé", "sont imposées par la BRVM"], 1, "Elles aident à juger, sans garantir."]] },
  { id: "n2-5", titre: "La liquidité : pourrez-vous revendre ?", texte: () => { const peu = DATA.stocks.filter(c => c.med && c.med < 2e6).sort((a, b) => a.med - b.med)[0], top = DATA.stocks.slice().sort((a, b) => (b.med || 0) - (a.med || 0))[0]; return `<p>La liquidité, c’est le montant échangé chaque jour. Sur la BRVM, elle varie énormément d’une société à l’autre.</p><p>${top ? `${fiche(top.t)} s’échange pour environ ${mdsA(top.med)} par jour` : ""}${peu ? `, alors que ${fiche(peu.t)} s’échange pour environ ${mdsA(peu.med)}` : ""}. Sur une valeur peu échangée, revendre peut prendre des jours, ou obliger à baisser son prix.</p><p>Règle simple : plus votre montant est important, plus il faut privilégier les sociétés « très échangées » (badge vert dans NAFA).</p>`; },
    quiz: [["La liquidité mesure…", ["le bénéfice", "le montant échangé chaque jour", "la trésorerie de l’entreprise"], 1, "Elle indique la facilité à acheter ou vendre."], ["Sur une valeur peu échangée…", ["on revend toujours en une minute", "revendre peut prendre du temps", "les frais sont nuls"], 1, "Il faut trouver un acheteur à votre prix."], ["Pour un gros montant, on privilégie…", ["les valeurs très échangées", "les valeurs inactives", "n’importe laquelle"], 0, "Pour pouvoir entrer et sortir sans trop bouger le prix."]] },
  { id: "n2-6", titre: "Les signaux d’alerte", texte: () => `<p>Quelques signaux doivent toujours faire réfléchir :</p><ul><li><b>Des fonds propres négatifs</b> : les pertes accumulées dépassent le capital. Cas : ${fiche("UNLC")} (${mdsA(fF("UNLC", "capitaux_propres"))} en 2023).</li><li><b>Un bénéfice porté par l’exceptionnel</b> : il ne se répétera pas. Cas : ${fiche("NEIC")}.</li><li><b>Une perte</b>, surtout si elle se répète. Cas : ${fiche("SCRC")}.</li><li><b>Des comptes anciens ou non publiés</b>.</li><li><b>Un dividende réduit</b> ou supprimé.</li></ul><p>NAFA affiche ces alertes en rouge dans la section « Chiffres clés » de chaque fiche.</p>`,
    quiz: [["Des fonds propres négatifs signifient…", ["une société très riche", "des pertes accumulées supérieures au capital", "un dividende record"], 1, "C’est une situation financière fragile."], ["Un bénéfice dû à la vente d’un terrain…", ["se répétera chaque année", "ne se répétera pas forcément", "est interdit"], 1, "C’est un élément exceptionnel (HAO)."], ["Où voir ces alertes dans NAFA ?", ["Dans « Chiffres clés » de la fiche", "Nulle part", "Seulement sur papier"], 0, "Elles s’affichent en rouge."]] },
  { id: "n2-7", titre: "Les opérations sur titres", texte: () => `<p>Une société peut modifier ses actions :</p><ul><li><b>Le fractionnement</b> : une action est divisée en plusieurs. Le cours est divisé d’autant ; votre patrimoine ne change pas. Cas : ${fiche("SNTS")}, fractionnement annoncé en octobre 2026.</li><li><b>L’augmentation de capital</b> : la société émet de nouvelles actions. Les actionnaires reçoivent souvent des <b>droits de souscription</b> pour acheter en priorité.</li><li><b>L’offre publique de retrait</b> : l’actionnaire principal propose de racheter les autres actionnaires, souvent avec une prime.</li></ul>`,
    quiz: [["Après un fractionnement par 10, votre patrimoine…", ["est multiplié par 10", "ne change pas", "est divisé par 10"], 1, "Vous avez 10 fois plus d’actions, chacune 10 fois moins chère."], ["Un droit de souscription permet…", ["d’acheter en priorité des actions nouvelles", "de ne pas payer d’impôt", "de voter deux fois"], 0, "Il protège les actionnaires existants."], ["Une offre publique de retrait vise à…", ["racheter les petits actionnaires", "créer une nouvelle bourse", "verser un dividende"], 0, "L’actionnaire principal propose de reprendre leurs titres."]] } ] },
 { id: "n3", titre: "Niveau 3 · Construire son épargne", badge: "🏗️ Investisseur", intro: "Organiser son épargne dans la durée, entre actions, obligations et fonds.", lecons: [
  { id: "n3-1", titre: "Diversifier", texte: () => `<p>Ne mettez pas tout sur une seule société. Répartissez entre <b>plusieurs sociétés</b>, <b>plusieurs secteurs</b> (banques, télécoms, agro-industrie, distribution…) et <b>plusieurs pays</b>.</p><p>Attention aux faux amis : plusieurs filiales d’un même groupe, comme les banques BOA, évoluent souvent ensemble.</p><p>L’onglet <a href="#portefeuille">Portefeuille</a> vous alerte quand un secteur ou une société pèse trop lourd.</p>`,
    quiz: [["Diversifier sert à…", ["gagner plus à coup sûr", "limiter les dégâts si une société va mal", "payer moins de frais"], 1, "Le risque est réparti."], ["Quatre banques du même groupe, c’est…", ["une bonne diversification", "une diversification limitée", "interdit"], 1, "Elles dépendent souvent des mêmes décisions."], ["Où NAFA signale-t-il une concentration ?", ["Dans Portefeuille", "Dans Annonces", "Nulle part"], 0, "Avec la répartition par secteur."]] },
  { id: "n3-2", titre: "Épargner chaque mois", texte: () => `<p>Investir un petit montant <b>chaque mois</b> a deux avantages : on prend l’habitude d’épargner, et on achète à des prix différents, ce qui lisse les hauts et les bas du marché.</p><p>Si vous réinvestissez vos dividendes, ils achètent de nouvelles actions qui en versent à leur tour : c’est l’effet <b>boule de neige</b>. Sur dix ou vingt ans, il pèse lourd.</p><p>L’onglet <a href="#plan">Plan</a> simule votre épargne mensuelle selon votre profil.</p>`,
    quiz: [["Investir chaque mois permet…", ["d’acheter toujours au plus bas", "de lisser les prix d’achat", "d’éviter tous les risques"], 1, "On achète à des prix variés."], ["L’effet boule de neige vient…", ["du réinvestissement des revenus", "des frais", "des impôts"], 0, "Les revenus produisent à leur tour des revenus."], ["Cet effet demande surtout…", ["de la chance", "du temps et de la régularité", "un gros capital"], 1, "Il se construit sur des années."]] },
  { id: "n3-3", titre: "Actions, obligations ou fonds ?", texte: () => `<div class="tablewrap"><table><thead><tr><th></th><th>Actions</th><th>Obligations</th><th>Fonds (OPCVM)</th></tr></thead><tbody><tr><td>Revenu</td><td>Dividende variable</td><td>Coupon fixe</td><td>Selon le fonds</td></tr><tr><td>Risque</td><td>Élevé</td><td>Plus faible</td><td>Selon le fonds</td></tr><tr><td>Horizon conseillé</td><td>5 ans et plus</td><td>Jusqu’à l’échéance</td><td>Selon le fonds</td></tr><tr><td>Effort</td><td>Choisir les sociétés</td><td>Choisir l’émetteur</td><td>Un gérant choisit pour vous</td></tr></tbody></table></div><p>Les <b>fonds</b> (FCP, SICAV) regroupent l’argent de nombreux épargnants, investi par un gérant professionnel. Ils sont proposés par les SGI et les sociétés de gestion.</p>`,
    quiz: [["Quel produit verse un revenu fixé à l’avance ?", ["L’action", "L’obligation", "Aucun"], 1, "Le coupon est fixé à l’émission."], ["Dans un fonds, qui choisit les placements ?", ["Vous", "Un gérant professionnel", "La BRVM"], 1, "C’est le principe de la gestion collective."], ["Pour un horizon de 2 ans, on évite plutôt…", ["les obligations courtes", "un portefeuille 100 % actions", "l’épargne"], 1, "Les actions demandent du temps pour traverser les baisses."]] },
  { id: "n3-4", titre: "Souscrire à un emprunt obligataire", texte: () => `<p>Les États et les entreprises lancent régulièrement des <b>emprunts par appel public à l’épargne</b>. Pendant la <b>période de souscription</b>, vous pouvez acheter des obligations via votre SGI, souvent à partir de montants accessibles.</p><p>Avant de souscrire, vérifiez : le <b>taux</b> du coupon, la <b>durée</b>, le mode de remboursement (en une fois ou par tranches), la <b>fiscalité</b> des intérêts et la solidité de l’<b>émetteur</b>.</p><p>Ensuite, l’obligation est cotée à la BRVM : vous pouvez la revendre avant l’échéance, à un prix qui peut être supérieur ou inférieur au prix payé.</p>`,

    const r = await sb.from("profils").update({ prenom: $("#p-prenom").value.trim(), nom: $("#p-nom").value.trim(), telephone: $("#p-tel").value.trim(), pays: $("#p-pays").value.trim() }).eq("id", USER.id);
    $("#p-msg").textContent = r.error ? "Échec : " + r.error.message : "Profil enregistré."; });
  $("#b-sync").addEventListener("click", async () => { await synchroniser(); vueMonCompte(); });
  $("#b-deco").addEventListener("click", async () => { await sb.auth.signOut(); location.hash = "#marche"; });
}
/* Envoi réel d'un dossier (version SGI, utilisateur connecté) */
async function envoyerDossier(d, fichiers) {
  const ins = await sb.from("dossiers").insert({ sgi_id: MQ.id, donnees: d }).select("id, ref, statut").single();
  if (ins.error) throw ins.error;
  for (const [nom, f] of fichiers) {
    if (!f) continue;
    const ext = (f.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
    const up = await sb.storage.from("pieces").upload(`${MQ.id}/${USER.id}/${ins.data.ref}-${nom}.${ext}`, f, { upsert: true });
    if (up.error) throw up.error;
  }
  return ins.data;
}
async function statutServeur(d) {
  const r = await sb.from("dossiers").select("statut, note_sgi, updated_at").eq("id", d.id).maybeSingle();
  return r.data;
}
/* Espace SGI : traitement des dossiers reçus */
async function vueSGI() {
  if (!sb || !USER) { sessionStorage.setItem("nafa_retour", "#sgi"); location.hash = "#moncompte"; return; }
  if (!AGENT) await chercherAgent();
  if (!AGENT) { $("#contenu").innerHTML = `<h2>Espace SGI</h2><div class="alerte warn">Ce compte n’est pas enregistré comme agent d’une SGI.</div>`; return; }
  $("#contenu").innerHTML = `<h2>Espace SGI · ${esc(AGENT.sgi_id)}</h2><p class="aide">Dossiers d’ouverture de compte reçus via l’application.</p><div class="actions"><button type="button" class="bouton second" id="s-csv">Exporter en CSV</button></div><div id="s-liste">Chargement…</div>`;
  const r = await sb.from("dossiers").select("*").eq("sgi_id", AGENT.sgi_id).order("created_at", { ascending: false });
  if (r.error) { $("#s-liste").innerHTML = `<div class="alerte bad">${esc(r.error.message)}</div>`; return; }
  const L = r.data || [];
  $("#s-liste").innerHTML = L.length ? L.map(x => { const d = x.donnees || {}; return `<section class="une"><h3>${esc(x.ref)} · ${esc((d.prenom || "") + " " + (d.nom || ""))} <span class="badge info">${esc(x.statut)}</span></h3>
    <p class="aide" style="margin:.2em 0">Reçu le ${dateFr(x.created_at.slice(0, 10))} · ${esc(d.tel || "")} · ${esc(d.ville || "")}, ${esc(d.pays || "")}</p>
    <p style="font-size:15px">Montant : ${esc(d.montant || "")} · Horizon : ${esc(d.horizon || "")} · Expérience : ${esc(d.exp || "")} · Profil : ${esc(d.profil || "")} · Pièce : ${esc(d.piece || "")} n° ${esc(d.numpiece || "")}</p>
    <div class="deux-champs"><label>Statut <select data-st="${x.id}">${STATUTS.concat([["refuse", "Refusé"]]).map(([k, l]) => `<option value="${k}"${x.statut === k ? " selected" : ""}>${l}</option>`).join("")}</select></label><label>Note visible du client <input data-no="${x.id}" value="${esc(x.note_sgi || "")}"></label></div>
    <div class="actions"><button type="button" class="petit" data-save="${x.id}">Enregistrer</button><button type="button" class="petit" data-pj="${x.id}" data-u="${x.user_id}" data-ref="${esc(x.ref)}">Voir les pièces</button></div><div id="pj-${x.id}"></div><p class="aide" id="sm-${x.id}" aria-live="polite"></p></section>`; }).join("") : `<p class="aide">Aucun dossier pour le moment.</p>`;
  document.querySelectorAll("[data-save]").forEach(b => b.addEventListener("click", async () => { const id = b.dataset.save;
    const u = await sb.from("dossiers").update({ statut: document.querySelector(`[data-st="${id}"]`).value, note_sgi: document.querySelector(`[data-no="${id}"]`).value }).eq("id", id);
    $("#sm-" + id).textContent = u.error ? "Échec : " + u.error.message : "Enregistré : le client voit le nouveau statut."; }));
  document.querySelectorAll("[data-pj]").forEach(b => b.addEventListener("click", async () => { const id = b.dataset.pj, dossier = `${AGENT.sgi_id}/${b.dataset.u}`;
    const ls = await sb.storage.from("pieces").list(dossier); const fs = (ls.data || []).filter(o => o.name.startsWith(b.dataset.ref));
    if (!fs.length) { $("#pj-" + id).innerHTML = `<p class="aide">Aucune pièce jointe.</p>`; return; }
    const liens = await Promise.all(fs.map(o => sb.storage.from("pieces").createSignedUrl(`${dossier}/${o.name}`, 120)));
    $("#pj-" + id).innerHTML = `<ul class="liste-actus">${liens.map((l, i) => l.data ? `<li>${lienExt(l.data.signedUrl, fs[i].name)} <span class="aide">(lien valable 2 minutes)</span></li>` : "").join("")}</ul>`; }));
  $("#s-csv").addEventListener("click", () => {
    const cols = ["ref", "statut", "created_at", "prenom", "nom", "tel", "ville", "pays", "montant", "horizon", "exp", "profil", "piece"];
    const lignes = [cols.join(";")].concat(L.map(x => cols.map(c => String(x[c] ?? (x.donnees || {})[c] ?? "").replace(/;/g, ",")).join(";")));
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + lignes.join("\n")], { type: "text/csv" })); a.download = `dossiers_${AGENT.sgi_id}.csv`; a.click();
  });
}

$("#retour").addEventListener("click", () => aller(S.step - 1));
$("#suite").addEventListener("click", () => aller(S.step + 1));

$("#recommencer").addEventListener("click", () => {
  const b = $("#recommencer");
  if (!attente) { b.textContent = "Cliquez encore pour confirmer l’effacement"; attente = setTimeout(() => { b.textContent = "Tout effacer et recommencer"; attente = null; }, 4000); return; }
  clearTimeout(attente); attente = null; b.textContent = "Tout effacer et recommencer";
  try { localStorage.removeItem(CLE); } catch (e) { /* rien */ }
  S = JSON.parse(JSON.stringify(DEF)); aller(0);
});
document.addEventListener("click", e => { if (e.target.closest("a.marque") && (location.hash === "#marche" || !location.hash)) window.scrollTo({ top: 0, behavior: "smooth" }); });
initSupa();
rendre();
